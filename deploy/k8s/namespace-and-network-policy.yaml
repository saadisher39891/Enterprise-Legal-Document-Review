apiVersion: v1
kind: Namespace
metadata:
  name: legal-platform
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-services-only
  namespace: legal-platform
spec:
  podSelector:
    matchLabels:
      exposure: internal
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
