# 15-service workload catalogue
# Sanitized .NET 8 workload templates. Replace image tags and secrets per environment.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-api
  namespace: legal-platform
  labels:
    app: document-api
    exposure: external
spec:
  replicas: 2
  selector:
    matchLabels: { app: document-api }
  template:
    metadata:
      labels: { app: document-api, exposure: external }
    spec:
      serviceAccountName: legal-service
      containers:
        - name: document-api
          image: acr.example.azurecr.io/document-api:1.0.0
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: legal-platform-secrets } }]
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: document-api
  namespace: legal-platform
spec:
  type: ClusterIP
  selector: { app: document-api }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
