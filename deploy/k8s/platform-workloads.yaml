---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: legal-platform
spec:
  serviceName: redis
  replicas: 3
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          resources: { requests: {cpu: "100m", memory: "128Mi"}, limits: {cpu: "500m", memory: "512Mi"} }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: legal-platform
spec:
  serviceName: mongodb
  replicas: 3
  selector: { matchLabels: { app: mongodb } }
  template:
    metadata: { labels: { app: mongodb } }
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports: [{containerPort: 27017}]
          envFrom: [{secretRef: {name: legal-platform-secrets}}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: legal-platform
spec:
  serviceName: elasticsearch
  replicas: 3
  selector: { matchLabels: { app: elasticsearch } }
  template:
    metadata: { labels: { app: elasticsearch } }
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
          ports: [{containerPort: 9200}]
          env:
            - {name: discovery.type, value: single-node}
            - {name: xpack.security.enabled, value: "false"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: legal-platform}
spec:
  replicas: 2
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:0.104.0
          ports: [{containerPort: 4317}, {containerPort: 4318}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: legal-platform}
spec:
  replicas: 2
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.0
          ports: [{containerPort: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: legal-platform}
spec:
  replicas: 2
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports: [{containerPort: 3000}]
