apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-ingestion
  namespace: legal-platform
spec:
  replicas: 2
  selector:
    matchLabels: { app: document-ingestion }
  template:
    metadata:
      labels: { app: document-ingestion }
    spec:
      containers:
        - name: document-ingestion
          image: acr.example.azurecr.io/document-ingestion:1.0.0
          ports: [{containerPort: 8080}]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: document-ingestion-queue
  namespace: legal-platform
spec:
  scaleTargetRef:
    name: document-ingestion
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers:
    - type: azure-servicebus
      metadata:
        queueName: document-review-ingestion
        messageCount: "25"
