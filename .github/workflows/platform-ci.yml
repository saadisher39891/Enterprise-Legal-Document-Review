name: legal-platform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portfolio-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portfolio repository validation
        shell: bash
        run: |
          echo "Validating sanitized Enterprise Legal Document Review portfolio"
          echo "Application manifests:"
          find deploy/k8s -type f -name '*.yaml' -print 2>/dev/null || true
          echo "Infrastructure files:"
          find infra ansible azure-devops docs -maxdepth 3 -type f -print 2>/dev/null || true
          echo "Validation complete"
