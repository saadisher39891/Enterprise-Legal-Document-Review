name: legal-platform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: acr.example.azurecr.io

jobs:
  discover-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.matrix }}
    steps:
      - id: services
        run: |
          echo 'matrix=["document-api","document-ingestion","document-preview","metadata-service","matter-service","review-workflow","annotation-service","search-service","notification-service","identity-adapter","audit-service","reporting-service","export-service","integration-service","user-preferences"]' >> "$GITHUB_OUTPUT"

  build-test-scan:
    needs: discover-services
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover-services.outputs.services) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore and test service
        run: |
          if [ -f "src/${{ matrix.service }}/${{ matrix.service }}.csproj" ]; then
            dotnet restore "src/${{ matrix.service }}/${{ matrix.service }}.csproj"
            dotnet test "src/${{ matrix.service }}/${{ matrix.service }}.csproj" --no-restore
          else
            echo "Sanitized portfolio manifest: source folder not included"
          fi
      - name: Build container
        run: docker build --tag "${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}" "src/${{ matrix.service }}" || true
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}"
          format: table
          exit-code: '0'

  validate-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Terraform format
        run: terraform -chdir=infra/terraform fmt -check
      - name: Kubernetes manifest validation
        run: |
          kubectl apply --dry-run=client -f deploy/k8s
      - name: Security review
        run: |
          grep -RInE 'password=|secret=|api[_-]?key' . --exclude-dir=.git || true

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [build-test-scan, validate-infrastructure]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Publish placeholder
        run: echo "Use OIDC login to Azure and push signed images to ACR in the deployment environment."
