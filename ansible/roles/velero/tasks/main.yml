- name: Install Velero CLI prerequisites
  package:
    name: "{{ item }}"
    state: present
  loop:
    - curl
    - tar

- name: Apply Velero configuration
  command: kubectl apply -f "{{ velero_manifest }}"
  changed_when: true

- name: Verify Velero deployment
  command: kubectl -n velero rollout status deployment/velero --timeout=180s
  changed_when: false
